[project]
name = "mensapeeker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nic", email = "nic9323@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[project.scripts]
mensapeeker = "mensapeeker:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
